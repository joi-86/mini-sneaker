<style>
:root {
  --primary: #FF6B9D;
  --primary-dark: #E8558A;
  --primary-light: #FFF0F5;
  --primary-mid: #FFD6E7;
  --secondary: #FF9F43;
  --success: #10B981;
  --danger: #EF4444;
  --dark: #1A1A2E;
  --text: #2D3748;
  --text-muted: #718096;
  --border: #FFE4EE;
  --bg: #FFF5F8;
  --white: #FFFFFF;
  --radius: 14px;
  --shadow: 0 4px 20px rgba(255,107,157,0.1);
  --shadow-hover: 0 8px 30px rgba(255,107,157,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--primary-mid); border-radius:3px; }

/* NAVBAR */
.navbar {
  background:var(--white); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
  box-shadow:0 2px 12px rgba(255,107,157,0.08);
}
.nav-inner {
  max-width:1200px; margin:0 auto; padding:0 20px;
  display:flex; align-items:center; justify-content:space-between; height:64px;
}
.nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; cursor:pointer; }
.nav-logo .logo-box {
  width:40px; height:40px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  border-radius:12px; overflow:hidden; padding:0;
  box-shadow:0 4px 12px rgba(255,107,157,0.3);
}
.nav-logo .logo-name { font-size:18px; font-weight:800; color:var(--text); }
.nav-logo .logo-name span { color:var(--primary); }
.nav-menu { display:flex; align-items:center; gap:6px; }
.nav-link {
  padding:8px 16px; border-radius:8px; font-size:14px; font-weight:600;
  color:var(--text-muted); text-decoration:none; cursor:pointer;
  transition:all 0.2s; border:none; background:none; font-family:inherit;
}
.nav-link:hover, .nav-link.active { background:var(--primary-light); color:var(--primary); }
.nav-right { display:flex; align-items:center; gap:10px; }
.search-nav {
  display:flex; align-items:center; background:var(--bg);
  border:1.5px solid var(--border); border-radius:10px;
  padding:6px 12px; gap:6px; transition:border-color 0.2s;
}
.search-nav:focus-within { border-color:var(--primary); }
.search-nav input {
  border:none; background:none; outline:none;
  font-size:13px; font-family:inherit; color:var(--text); width:180px;
}
.search-nav input::placeholder { color:var(--text-muted); }
.hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:4px; }
.hamburger span { display:block; width:24px; height:2px; background:var(--text); border-radius:2px; transition:all 0.3s; }

/* PAGES */
.page { display:none; }
.page.active { display:block; }

/* HERO */
.hero {
  background:linear-gradient(135deg,var(--dark) 0%,#2D1B4E 50%,#1A1A2E 100%);
  padding:60px 20px; text-align:center; position:relative; overflow:hidden;
}
.hero::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,107,157,0.2) 0%,transparent 70%);
}
.hero-content { position:relative; max-width:600px; margin:0 auto; }
.hero-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,107,157,0.15); border:1px solid rgba(255,107,157,0.3);
  color:var(--primary); padding:6px 16px; border-radius:20px;
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:16px;
}
.hero h1 { font-size:clamp(28px,5vw,48px); font-weight:900; color:#fff; line-height:1.2; margin-bottom:12px; }
.hero h1 span { color:var(--primary); }
.hero p { font-size:15px; color:rgba(255,255,255,0.7); margin-bottom:28px; line-height:1.6; }
.hero-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.btn {
  display:inline-flex; align-items:center; gap:6px; padding:10px 24px;
  border-radius:10px; font-size:14px; font-weight:700; cursor:pointer;
  border:none; transition:all 0.2s; text-decoration:none; font-family:inherit;
}
.btn-primary {
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff; box-shadow:0 4px 15px rgba(255,107,157,0.35);
}
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,107,157,0.45); }
.btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.btn-outline { background:rgba(255,255,255,0.1); color:#fff; border:1.5px solid rgba(255,255,255,0.3); }
.btn-outline:hover { background:rgba(255,255,255,0.2); }

/* MAIN */
.container { max-width:1200px; margin:0 auto; padding:0 20px; }
#san-pham-section { padding:48px 0; }
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.section-title { font-size:22px; font-weight:800; color:var(--text); }
.section-title span { color:var(--primary); }

/* FILTER */
.filter-wrap {
  background:var(--white); border-radius:var(--radius); border:1px solid var(--border);
  padding:16px 20px; margin-bottom:24px; display:flex; align-items:center;
  gap:12px; flex-wrap:wrap; box-shadow:var(--shadow);
}
.filter-wrap select {
  padding:8px 12px; border:1.5px solid var(--border); border-radius:8px;
  font-size:13px; font-family:inherit; color:var(--text); background:var(--bg);
  cursor:pointer; outline:none; transition:border-color 0.2s;
  size:10;
}
.filter-wrap select:focus { border-color:var(--primary); }
.filter-search {
  display:flex; align-items:center; gap:6px; background:var(--bg);
  border:1.5px solid var(--border); border-radius:8px; padding:7px 12px;
  flex:1; min-width:200px; transition:border-color 0.2s;
}
.filter-search:focus-within { border-color:var(--primary); }
.filter-search input { border:none; background:none; outline:none; font-size:13px; font-family:inherit; color:var(--text); width:100%; }
.filter-search input::placeholder { color:var(--text-muted); }
.sort-tabs { display:flex; gap:6px; }
.sort-tab {
  padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600;
  cursor:pointer; border:1.5px solid var(--border); background:var(--white);
  color:var(--text-muted); transition:all 0.2s; font-family:inherit;
}
.sort-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }

/* PRODUCT GRID */
.product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
@media(max-width:768px) {
  .product-grid { grid-template-columns:repeat(2,1fr); gap:12px; }
}
.product-card {
  background:var(--white); border-radius:var(--radius); border:1px solid var(--border);
  overflow:hidden; transition:all 0.3s; cursor:pointer; box-shadow:var(--shadow);
}
.product-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); border-color:var(--primary-mid); }
.product-img { position:relative; overflow:hidden; aspect-ratio:1; background:var(--bg); }
.product-img img { width:100%; height:100%; object-fit:cover; transition:transform 0.4s; }
.product-card:hover .product-img img { transform:scale(1.06); }
.product-badge {
  position:absolute; top:10px; left:10px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700;
}
.product-img-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:48px; background:var(--primary-light); }
.product-info { padding:14px; }
.product-brand { font-size:11px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.product-name { font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.product-desc { font-size:12px; color:var(--text-muted); margin-bottom:10px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.product-footer { display:flex; align-items:center; justify-content:space-between; }
.product-price { font-size:16px; font-weight:800; color:var(--primary); }
.product-sizes { font-size:11px; color:var(--text-muted); background:var(--bg); padding:3px 8px; border-radius:6px; border:1px solid var(--border); }

/* EMPTY & SKELETON */
.empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); grid-column:1/-1; }
.empty-icon { font-size:56px; margin-bottom:14px; opacity:0.5; }
.empty-state p { font-size:14px; }
.loading-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
.skeleton { background:var(--white); border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); }
.skeleton-img { aspect-ratio:1; background:linear-gradient(90deg,var(--bg) 25%,var(--primary-light) 50%,var(--bg) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
.skeleton-text { padding:14px; display:flex; flex-direction:column; gap:8px; }
.skeleton-line { height:12px; border-radius:6px; background:linear-gradient(90deg,var(--bg) 25%,var(--primary-light) 50%,var(--bg) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* MODAL SẢN PHẨM */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
  z-index:90; display:flex; align-items:center; justify-content:center;
  padding:70px 16px 16px; opacity:0; transition:opacity 0.3s;
}
.modal-overlay.show { opacity:1; }
.modal-box {
  background:var(--white); border-radius:18px; width:100%; max-width:960px;
  max-height:92vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2);
  transform:scale(0.95); transition:transform 0.3s;
}
.modal-overlay.show .modal-box { transform:scale(1); }
.modal-body { display:grid; grid-template-columns:1fr 1fr; }
.modal-imgs { background:var(--bg); border-radius:18px 0 0 18px; overflow:hidden; position:relative; }
.modal-img-main { aspect-ratio:1; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.modal-img-main img { width:100%; height:100%; object-fit:cover; }
.modal-img-thumbs { display:flex; gap:6px; padding:10px; flex-wrap:wrap; }
.modal-thumb { width:52px; height:52px; border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid transparent; transition:border-color 0.2s; }
.modal-thumb.active { border-color:var(--primary); }
.modal-thumb img { width:100%; height:100%; object-fit:cover; }
.modal-info { padding:24px; display:flex; flex-direction:column; gap:12px; position:relative; }
.modal-brand { font-size:12px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:1px; }
.modal-name { font-size:20px; font-weight:800; color:var(--text); line-height:1.3; }
.modal-price { font-size:26px; font-weight:900; color:var(--primary); }
.modal-sizes { display:flex; flex-wrap:wrap; gap:6px; }
.modal-size-btn { width:38px; height:34px; border:1.5px solid var(--border); border-radius:6px; background:var(--white); font-size:12px; font-weight:700; color:var(--text-muted); cursor:default; display:flex; align-items:center; justify-content:center; }
.modal-desc { font-size:13px; color:var(--text-muted); line-height:1.6; padding:12px; background:var(--bg); border-radius:8px; }
.modal-close-btn {
  position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
  background:rgba(0,0,0,0.08); border:none; color:var(--text); font-size:16px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s;
}
.modal-close-btn:hover { background:rgba(0,0,0,0.15); }

/* ====== TRANG LIÊN HỆ ====== */
.page-hero {
  background:linear-gradient(135deg,var(--dark) 0%,#2D1B4E 50%,#1A1A2E 100%);
  padding:48px 20px 40px; text-align:center; position:relative; overflow:hidden;
}
.page-hero::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,107,157,0.2) 0%,transparent 70%);
}
.page-hero-content { position:relative; }
.page-hero h1 { font-size:clamp(24px,4vw,40px); font-weight:900; color:#fff; margin-bottom:8px; }
.page-hero h1 span { color:var(--primary); }
.page-hero p { font-size:14px; color:rgba(255,255,255,0.6); }

.breadcrumb {
  max-width:1200px; margin:0 auto; padding:16px 20px;
  display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted);
}
.breadcrumb span.link { color:var(--primary); cursor:pointer; }
.breadcrumb span.link:hover { text-decoration:underline; }

.lienhe-section { padding:8px 0 48px; }
.contact-wrap { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
@media (max-width:768px) {
  .contact-wrap { grid-template-columns:1fr; }
}

.contact-info {
  background:linear-gradient(135deg,var(--dark),#2D1B4E);
  border-radius:var(--radius); padding:32px; color:#fff; position:relative; overflow:hidden;
}
.contact-info::before { content:''; position:absolute; top:-40px; right:-40px; width:160px; height:160px; background:rgba(255,107,157,0.15); border-radius:50%; }
.contact-info h3 { font-size:20px; font-weight:800; margin-bottom:20px; position:relative; }
.contact-item { display:flex; align-items:center; gap:12px; margin-bottom:16px; position:relative; }
.contact-icon { width:40px; height:40px; border-radius:10px; background:rgba(255,107,157,0.2); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.contact-label { font-size:11px; color:rgba(255,255,255,0.5); margin-bottom:2px; }
.contact-value { font-size:14px; font-weight:600; color:#fff; }
.social-links { display:flex; gap:10px; flex-wrap:wrap; }
.social-link {
  width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.08);
  display:flex; align-items:center; justify-content:center; text-decoration:none;
  font-size:18px; transition:all 0.2s; border:1px solid rgba(255,255,255,0.1);
}
.social-link:hover { background:var(--primary); border-color:var(--primary); transform:translateY(-2px); }

.contact-form {
  background:var(--white); border-radius:var(--radius); border:1px solid var(--border);
  padding:32px; box-shadow:var(--shadow);
}
.contact-form h3 { font-size:18px; font-weight:800; color:var(--text); margin-bottom:20px; }
.form-group { margin-bottom:14px; }
.form-label { display:block; font-size:12px; font-weight:700; color:var(--primary); margin-bottom:5px; }
.form-input {
  width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px;
  font-size:13px; font-family:inherit; color:var(--text); background:var(--bg);
  outline:none; transition:border-color 0.2s;
}
.form-input:focus { border-color:var(--primary); background:var(--white); }
.form-input::placeholder { color:var(--text-muted); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-select {
  width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px;
  font-size:13px; font-family:inherit; color:var(--text); background:var(--bg);
  outline:none; cursor:pointer; transition:border-color 0.2s;
}
.form-select:focus { border-color:var(--primary); }

.success-msg { display:none; text-align:center; padding:32px 16px; animation:fadeIn 0.4s ease; }
.success-msg .success-icon { font-size:56px; margin-bottom:14px; }
.success-msg h4 { font-size:20px; font-weight:800; color:var(--success); margin-bottom:8px; }
.success-msg p { font-size:14px; color:var(--text-muted); }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* FOOTER */
footer { background:var(--dark); color:rgba(255,255,255,0.8); padding:40px 0 20px; }
.footer-top { display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:32px; margin-bottom:32px; }
@media(max-width:768px) { .footer-top { grid-template-columns:1fr; } }
@media (max-width:768px) {
  .nav-inner { position:relative; flex-wrap:wrap; }
}
.footer-brand .brand-name { font-size:20px; font-weight:800; color:#fff; margin-bottom:10px; }
.footer-brand .brand-name span { color:var(--primary); }
.footer-brand p { font-size:13px; line-height:1.6; color:rgba(255,255,255,0.5); margin-bottom:16px; }
.footer-col h4 { font-size:14px; font-weight:700; color:#fff; margin-bottom:14px; }
.footer-col ul { list-style:none; }
.footer-col ul li { margin-bottom:8px; }
.footer-col ul li a { color:rgba(255,255,255,0.5); text-decoration:none; font-size:13px; transition:color 0.2s; cursor:pointer; }
.footer-col ul li a:hover { color:var(--primary); }
.footer-bottom { border-top:1px solid rgba(255,255,255,0.08); padding-top:20px; display:flex; align-items:center; justify-content:space-between; font-size:12px; color:rgba(255,255,255,0.4); flex-wrap:wrap; gap:8px; }

/* TOAST */
#toast-wrap { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
.toast { padding:12px 18px; border-radius:10px; font-size:13px; font-weight:600; min-width:240px; display:flex; align-items:center; gap:8px; box-shadow:0 4px 20px rgba(0,0,0,0.1); animation:slideIn 0.3s ease; border-left:4px solid; }
.toast-success { background:#F0FDF4; border-color:var(--success); color:#166534; }
.toast-error   { background:#FEF2F2; border-color:var(--danger);  color:#991B1B; }
.toast-info    { background:var(--primary-light); border-color:var(--primary); color:var(--primary-dark); }
@keyframes slideIn { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }

/* SCROLL TOP */
#scroll-top {
  position:fixed; bottom:24px; left:24px; width:42px; height:42px; border-radius:50%;
  background:var(--primary); color:#fff; border:none; cursor:pointer; font-size:18px;
  display:none; align-items:center; justify-content:center;
  box-shadow:0 4px 15px rgba(255,107,157,0.4); transition:all 0.2s; z-index:99;
}
#scroll-top:hover { transform:translateY(-2px); }
#scroll-top.show { display:flex; }

/* RESPONSIVE */
@media(max-width:768px) {
  .nav-menu.open .nav-link {
    padding:14px 20px;
    border-radius:0;
    border-bottom:1px solid var(--border);
    font-size:15px;
    text-align:left;
    width:100%;
  }
  .nav-menu.open .nav-link:hover,
  .nav-menu.open .nav-link.active {
    background:var(--primary-light);
    color:var(--primary);
    border-left:3px solid var(--primary);
    padding-left:17px;
  }
}

@media (max-width:768px) {
  .nav-menu { display:none; }
  .nav-menu { transition: transform 0.3s ease; }
  .nav-menu.open {
    display:flex; flex-direction:column;
    position:fixed; top:0; left:0; bottom:0; width:280px;
    background:var(--white);
    padding:0; gap:0; z-index:9999;
    box-shadow:4px 0 24px rgba(0,0,0,0.25);
    overflow-y:auto;
    animation: slideInLeft 0.25s ease;
    pointer-events:all;
  }
  @keyframes slideInLeft {
    from { transform: translateX(-100%); }
    to   { transform: translateX(0); }
  }

  .nav-left-mobile { display:none; }
  @media(max-width:768px) {
    .nav-left-mobile { display:flex; align-items:center; }
    .hamburger { display:flex; }
  }
  .hamburger { display:flex; }
  .nav-inner { position:relative; flex-wrap:wrap; }
  .search-nav { display:none; }
  .modal-body { grid-template-columns:1fr; }
  .modal-imgs { border-radius:18px 18px 0 0; }
  .contact-wrap { grid-template-columns:1fr; }
  .footer-top { grid-template-columns:1fr; gap:24px; }
  .form-row { grid-template-columns:1fr; }
  .hero { padding:40px 16px; }
}
@media (min-width: 769px) {
  .nav-menu-header { display: none !important; }
}

/* ICON MXH thật */
.social-icon-img {
  width:28px; height:28px; object-fit:contain; border-radius:6px;
}
.contact-icon-img {
  width:22px; height:22px; object-fit:contain;
}


/* MOBILE NAV - Logo trái, hamburger trái */
@media (max-width: 768px) {
  .nav-inner {
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
  }
  .nav-left-mobile {
    display: flex !important;
    align-items: center;
    order: -1;
  }
  .nav-logo {
    order: 0;
  }
  .nav-right {
    margin-left: auto;
  }
}

/* PAGINATION */
.pagination { display:flex; align-items:center; justify-content:center; gap:6px; padding:24px 0; flex-wrap:wrap; }
.page-btn {
  min-width:36px; height:36px; padding:0 10px; border-radius:8px;
  border:1.5px solid var(--border); background:var(--white);
  font-size:13px; font-weight:700; color:var(--text-muted);
  cursor:pointer; transition:all 0.2s; font-family:inherit;
}
.page-btn:hover { border-color:var(--primary); color:var(--primary); }
.page-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.page-btn:disabled { opacity:0.4; cursor:not-allowed; }
.pagination-btn {
  min-width:36px; height:36px; padding:0 10px; border-radius:8px;
  border:1.5px solid var(--border); background:var(--white);
  font-size:13px; font-weight:700; color:var(--text-muted);
