let allProducts = [];
let currentSort = '';
let modalImgs   = [];
let currentImg  = 0;
let productsLoaded = false;

const PAGE_SIZE_DEFAULT = 20;
let pageState = {
  home:    { page:1, size:20 },
  sanpham: { page:1, size:20 },
  nam:     { page:1, size:20 },
  nu:      { page:1, size:20 },
  dep:     { page:1, size:20 },

let filteredCache = { home:[], sanpham:[], nam:[], nu:[], dep:[] };

// ====== ĐIỀU HƯỚNG TRANG ======
function showPage(name, navBtn) {
  // Ẩn tất cả trang
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Active nav
  document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
  if (navBtn) {
    navBtn.classList.add('active');
  } else {
    var map = { home: 'nav-home', lienhe: 'nav-lienhe', nam: 'nav-nam', nu: 'nav-nu', dep: 'nav-dep', sanpham: 'nav-sp' };
    var el = document.getElementById(map[name]);
    if (el) el.classList.add('active');
  }

  // Chỉ hiện search ở trang chủ
  var searchBox = document.getElementById('search-box');
  if (searchBox) searchBox.style.display = name === 'home' ? 'flex' : 'none';

  // Khi vào trang sản phẩm thì render
  if (name === 'sanpham' && productsLoaded) {
    filteredCache.sanpham = allProducts;
    pageState.sanpham.page = 1;
    updateBanFilter('sanpham');
    applyPage('sanpham');
  }
  
  if ((name === 'nam' || name === 'nu' || name === 'dep') && productsLoaded) {
    const hangList = allProducts.map(sp=>({id:sp.danhMucId,tenDanhMuc:sp.danhMucTen}))
      .filter((v,i,a)=>v.id&&a.findIndex(x=>x.id===v.id)===i);
    const loaiList = allProducts.map(sp=>({id:sp.loaiId,tenDanhMuc:sp.loaiTen}))
      .filter((v,i,a)=>v.id&&a.findIndex(x=>x.id===v.id)===i);
    fillPhanHeFilters(name, hangList, loaiList);
    updateBanFilter(name);
    filterProductsPhanHe(name);
  }

  // Đóng mobile menu
  var menu = document.getElementById('nav-menu');
  // var overlay = document.getElementById('menu-overlay');
  menu.classList.remove('open');
  // if (overlay) { overlay.style.display = 'none'; overlay.style.zIndex = '-1'; }
  document.body.style.overflow = '';
  // Reset search trang chủ khi chuyển tab mobile
  var spSearch = document.getElementById('sp-filter-search');
  if (spSearch) spSearch.value = '';
}

// ====== INIT ======
window.addEventListener('DOMContentLoaded', function() {
  loadDanhMuc();
  loadProducts();
  //loadSocialLinks();
  window.addEventListener('scroll', function() {
    document.getElementById('scroll-top').classList.toggle('show', window.scrollY > 400);

});

// ====== API ======
async function apiCall(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('page', 'api');
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const res  = await fetch(url.toString());
  const data = await res.json();
  return data;
}

// ====== DANH MỤC ======
async function loadDanhMuc() {
  try {
    const res = await apiCall('getDanhMuc');
    if (!res.success) return;
    const hangList = res.data.filter(d => d.loai === 'hang' || !d.loai);
    hangList.sort((a, b) => a.tenDanhMuc.localeCompare(b.tenDanhMuc, 'vi'));
    const loaiList = res.data.filter(d => d.loai === 'loai');
    loaiList.sort((a, b) => a.tenDanhMuc.localeCompare(b.tenDanhMuc, 'vi'));
    const fHang = document.getElementById('filter-hang');
    hangList.forEach(d => { fHang.innerHTML += `<option value="${d.id}">${d.tenDanhMuc}</option>`; });
    const fLoai = document.getElementById('filter-loai');
    loaiList.forEach(d => { fLoai.innerHTML += `<option value="${d.id}">${d.tenDanhMuc}</option>`; });

    // Fill cho trang sản phẩm riêng
    const spFHang = document.getElementById('home-filter-hang');

    hangList.forEach(d => { spFHang.innerHTML += `<option value="${d.id}">${d.tenDanhMuc}</option>`; });
    const spFLoai = document.getElementById('home-filter-loai');

    loaiList.forEach(d => { spFLoai.innerHTML += `<option value="${d.id}">${d.tenDanhMuc}</option>`; });
  } catch(e) { console.error(e); }
}

// ====== SẢN PHẨM ======
async function loadProducts() {
  try {
    document.getElementById('skeleton-list').style.display = 'grid';
    const res = await apiCall('getSanPham');
    document.getElementById('skeleton-list').style.display = 'none';
    if (!res.success) { showToast('Không thể tải sản phẩm!','error'); return; }
    allProducts = res.data;
    productsLoaded = true;
    
    filteredCache.home = allProducts;
    filteredCache.sanpham = allProducts;
    updateBanFilter('home');
    updateBanFilter('sanpham');
    applyPage('home');
    renderBrandScroll();

    // Fill size options theo từng phân hệ
    const getSizes = (phanHe) => {
      const list = phanHe
        ? allProducts.filter(sp => sp.phanHe && sp.phanHe.toString().split(',').map(s=>s.trim()).includes(phanHe))
        : allProducts;
      return [...new Set(list.flatMap(sp => sp.sizes||[]))].sort((a,b)=>parseFloat(a)-parseFloat(b));
    };

    // Fill bản cho trang chủ và sản phẩm
    const banLabels = {
      under_authentic: 'Under Authentic',
      best_quality: 'Best Quality',
      likeauth: 'Likeauth',
      sieu_cap: 'Siêu Cấp',
      rep_1_1: 'Rep 1:1'
    };

    const sizeMap = {
      'home-filter-size': null,
      'sp-filter-size':   null,
      'nam-filter-size':  'nam',
      'nu-filter-size':   'nu',
      'dep-filter-size':  'dep',
    };

    Object.entries(sizeMap).forEach(([id, phanHe]) => {
      const sel = document.getElementById(id);
      if (!sel) return;
      sel.innerHTML = '<option value="">Tất cả size</option>';
      getSizes(phanHe).forEach(s => { sel.innerHTML += `<option value="${s}">${s}</option>`; });
    });

  } catch(e) {
    document.getElementById('skeleton-list').style.display = 'none';
    showToast('Lỗi kết nối!','error');
  }
}

          </div>
          <div class="product-sizes">${sp.sizes && sp.sizes.length > 0 ? sp.sizes[0]+(sp.sizes.length>1?' - '+sp.sizes[sp.sizes.length-1]:'') : 'Liên hệ'}</div>

function filterProducts() {
  const kw   = document.getElementById('filter-search').value.toLowerCase();
  const hang = document.getElementById('filter-hang').value;
  const loai = document.getElementById('filter-loai').value;
  const gia  = document.getElementById('filter-gia').value;
  const ban  = document.getElementById('sp-filter-ban') ? document.getElementById('sp-filter-ban').value : '';
  const size = document.getElementById('home-filter-size') ? document.getElementById('home-filter-size').value : '';
  // trong filter thêm:
  let filtered = allProducts.filter(sp => {
    const matchKw   = !kw   || sp.tenSanPham.toLowerCase().includes(kw) || sp.maSanPham.toLowerCase().includes(kw);
    const matchHang = !hang || sp.danhMucId === hang;
    const matchLoai = !loai || sp.loaiId    === loai;
    const matchBan  = !ban  || sp.ban === ban;
    const matchSize = !size || (sp.sizes && sp.sizes.includes(size));
    return matchKw && matchHang && matchLoai && matchBan && matchSize;
  });
  
  const giaThucTe = sp => sp.phanTramGiam > 0 ? Math.round(sp.giaBan * (1 - sp.phanTramGiam/100)) : sp.giaBan;
  if (gia === 'asc')  filtered.sort((a,b) => giaThucTe(a) - giaThucTe(b));
  if (gia === 'desc') filtered.sort((a,b) => giaThucTe(b) - giaThucTe(a));

  filteredCache.sanpham = filtered;
  pageState.sanpham.page = 1;
  applyPage('sanpham');
}

function setSortTab(sort, btn) {
  currentSort = sort;
  document.querySelectorAll('.sort-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterProducts();
}

function searchProducts(kw) {

  showPage('home');
  document.getElementById('filter-search').value = kw;

  setTimeout(() => document.getElementById('san-pham-section').scrollIntoView({behavior:'smooth'}), 150);
}

// ====== PHẢN HỒI ======
async function submitPhanHoi() {
  const ten     = document.getElementById('ph-ten').value.trim();
  const sdt     = document.getElementById('ph-sdt').value.trim();
  const email   = document.getElementById('ph-email').value.trim();
  const loai    = document.getElementById('ph-loai').value;
  const noiDung = document.getElementById('ph-noidung').value.trim();

  if (!ten)     { showToast('Vui lòng nhập họ tên!','error');   document.getElementById('ph-ten').focus();     return; }
  if (!noiDung) { showToast('Vui lòng nhập nội dung!','error'); document.getElementById('ph-noidung').focus(); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Đang gửi...';

  try {
    const res = await apiCall('submitPhanHoi', {
      tenKhachHang: ten, soDienThoai: sdt, email: email, loai: loai, noiDung: noiDung
    });
    if (res.success) {
      document.getElementById('form-wrap').style.display  = 'none';
      document.getElementById('success-msg').style.display = 'block';
    } else {
      showToast(res.message || 'Gửi thất bại!','error');
      btn.disabled = false;
      btn.textContent = '✔️ Gửi Phản Hồi';
    }
  } catch(e) {
    showToast('Lỗi kết nối!','error');
    btn.disabled = false;
    btn.textContent = '✔️ Gửi Phản Hồi';
  }
}

function resetForm() {
  ['ph-ten','ph-sdt','ph-email','ph-noidung'].forEach(id => document.getElementById(id).value = '');
  const btn = document.getElementById('submit-btn');
  btn.disabled = false;
  btn.textContent = '✔️ Gửi Phản Hồi';
  document.getElementById('form-wrap').style.display   = 'block';
  document.getElementById('success-msg').style.display = 'none';
}



function toggleMenu() {
  var menu = document.getElementById('nav-menu');
  var isOpen = menu.classList.toggle('open');
  document.body.style.overflow = isOpen ? 'hidden' : '';
}

function formatMoney(n) {
  if (!n) return 'Liên hệ';
  return new Intl.NumberFormat('vi-VN').format(n) + ' đ';
}

function showToast(msg, type = 'info') {
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span>${icons[type]}</span>${msg}`;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

  const size = document.getElementById('home-filter-size') ? document.getElementById('home-filter-size').value : '';
  // trong filter thêm:
  
  let filtered = allProducts.filter(sp => {

  const giaThucTe = sp => sp.phanTramGiam > 0 ? Math.round(sp.giaBan * (1 - sp.phanTramGiam/100)) : sp.giaBan;

  filteredCache.home = filtered;
  pageState.home.page = 1;
  applyPage('home');

// ====== PAGINATION ======
function renderPagination(containerId, tab, total) {
  const state = pageState[tab];
  const totalPages = Math.ceil(total / state.size);
  const el = document.getElementById(containerId);
  if (!el) return;
  if (total === 0) { el.innerHTML = ''; return; }

  const start = (state.page - 1) * state.size + 1;
  const end   = Math.min(state.page * state.size, total);

  let pagesHTML = '';
  for (let i = 1; i <= totalPages; i++) {
    if (totalPages > 7) {
      if (i > 2 && i < totalPages - 1 && Math.abs(i - state.page) > 1) {
        if (i === state.page - 2 || i === state.page + 2) {
          pagesHTML += `<span class="pagination-info">...</span>`;
        }
        continue;
      }
    }
    pagesHTML += `<button class="pagination-btn ${i === state.page ? 'active' : ''}" onclick="goPage('${tab}',${i})">${i}</button>`;
  }

  el.innerHTML = `
    <div class="pagination">
      <span class="pagination-info">Hiển thị</span>
      <select class="page-size-select" onchange="changePageSize('${tab}', this.value)">
        <option value="10" ${state.size==10?'selected':''}>10</option>
        <option value="20" ${state.size==20?'selected':''}>20</option>
        <option value="50" ${state.size==50?'selected':''}>50</option>
      </select>
      <span class="pagination-info">/ trang &nbsp; ${start}–${end} / ${total}</span>
      <button class="pagination-btn" onclick="goPage('${tab}', ${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>‹</button>
      ${pagesHTML}
      <button class="pagination-btn" onclick="goPage('${tab}', ${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>›</button>
    </div>`;
}
function goPage(tab, page) {
  pageState[tab].page = page;
  applyPage(tab);
  // Scroll lên đầu section
  var sections = {home:'san-pham-section', sanpham:'sp-product-list', nam:'nam-product-list', nu:'nu-product-list', dep:'dep-product-list'};
  var el = document.getElementById(sections[tab]);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function changePageSize(tab, size) {
  pageState[tab].size = parseInt(size);
  pageState[tab].page = 1;
  applyPage(tab);
}

function applyPage(tab) {
  const list = filteredCache[tab] || [];
  const state = pageState[tab];
  const start = (state.page-1)*state.size;
  const paged = list.slice(start, start+state.size);
  
  if (tab === 'home') {
    _renderProductsRaw(paged, 'product-list', 'sp-count', list.length);
    renderPagination('home-pagination', 'home', list.length);
  } else if (tab === 'sanpham') {
    _renderProductsSPRaw(paged, 'sp-product-list', 'sp-count-2', list.length);
    renderPagination('sanpham-pagination', 'sanpham', list.length);
  } else {
    _renderPhanHeRaw(tab, paged, list.length);
    renderPagination(tab+'-pagination', tab, list.length);
  }
}

function updateBanFilter(tab) {
  // Lấy danh sách sản phẩm thuộc tab này
  let products;
  if (tab === 'home' || tab === 'sanpham') {
    products = allProducts;
  } else {
    products = allProducts.filter(sp =>
      sp.phanHe && sp.phanHe.toString().split(',').map(s=>s.trim()).includes(tab)
    );
  }

  // Lấy các bản có trong sản phẩm của tab này
  const banCoTrong = [...new Set(products.map(sp => sp.ban).filter(b => b))];

  const BAN_LABELS = {
    under_authentic: 'Under Authentic',
    best_quality:    'Best Quality',
    likeauth:        'Likeauth',
    sieu_cap:        'Siêu Cấp',
    rep_1_1:         'Rep 1:1',
  };
  const BAN_ORDER = ['under_authentic','best_quality','likeauth','sieu_cap','rep_1_1'];

  // ID select của từng tab
  const selectIdMap = {
    home:    'home-filter-ban',
    sanpham: 'sp-filter-ban',
    nam:     'nam-filter-ban',
    nu:      'nu-filter-ban',
    dep:     'dep-filter-ban',
  };
  const sel = document.getElementById(selectIdMap[tab]);
  if (!sel) return;

  const current = sel.value; // giữ lại giá trị đang chọn
  sel.innerHTML = '<option value="">Tất cả phiên bản</option>';
  BAN_ORDER.forEach(val => {
    if (banCoTrong.includes(val)) {
      sel.innerHTML += `<option value="${val}"${current===val?' selected':''}>${BAN_LABELS[val]}</option>`;
    }
  });
}

function renderBrandScroll() {
  const BRAND_LOGOS = {
    'Adidas':   '18218X4_L4YJWEwHbK9oW45Hq_YxMo36n',
    'Asics':    '1cyCni5-CdUPXOLtbykqRa0O3enIzM84p',
    'Converse': '1qnwjLhMwaSHYo0ok6it3kMECwsObsBy0',
    'Golden Goose Deluxe Brand': '14LVRaHZ8hcwFTdqGwS1KA-cMtNVqn3zT',
    'Hoka':     '1mXVyGUg-iyQwQ7gmfTmhMMel0Zk9mQ4l',
    'Jordan':   '1rFD5ZxmAOPi-3EJpXDiBI7CJ-rqYQunS',
    'Louis Vuitton': '1eUtWToYE0tBbrL42PNj9S_5aUayd6xqU',
    'New Balance':   '15pOjfWWejhvXzy6XwHZOgYuvU-yBt-ie',
    'Nike':     '1eDfVmtUM2I549TpN5JtqQmOHdso7AkvQ',
    'On':       '1qLN0ytgxVpTlw87W-NRt68by4RF3A7s2',
    'On Running': '1qLN0ytgxVpTlw87W-NRt68by4RF3A7s2',
    'Puma':     '1CH2V0kRRWOr1Wx4wDWrMc1KCLEJmdPU-',
    'Tiger':    '1UQJsAgEcYE969HDKuQNltjuEL6xGd12d',
    'Onitsuka Tiger': '1UQJsAgEcYE969HDKuQNltjuEL6xGd12d',
    'Vans':     '1Wzm4c8o6lzA0FwtTF-iW3o4O0Wx0NTwq',
  };

  const hangMap = new Map();
  allProducts.forEach(sp => {
    if (sp.danhMucId && sp.danhMucTen) hangMap.set(sp.danhMucId, sp.danhMucTen);
  });

  const brandItems = [];
  hangMap.forEach((tenDanhMuc, id) => {
    if (tenDanhMuc === 'Golden Goose Deluxe Brand') return; // bỏ logo này
    const logoId = BRAND_LOGOS[tenDanhMuc] || BRAND_LOGOS[Object.keys(BRAND_LOGOS).find(k => k.toLowerCase() === tenDanhMuc.toLowerCase())];
    if (logoId) {
      brandItems.push({ id, ten: tenDanhMuc, logoId });
    }
  });

  if (brandItems.length === 0) return;

  const renderItem = b => `
    <div class="brand-item" onclick="goToBrand('${b.id}')">
      <img src="https://drive.google.com/thumbnail?id=${b.logoId}&sz=w200" alt="${b.ten}" />
    </div>`;

  const track = document.getElementById('brand-scroll');
  const REPEAT = 9; // lặp 9 lần để tạo cảm giác vô tận
  let trackHTML = '';
  for (let i = 0; i < REPEAT; i++) {
    trackHTML += brandItems.map(renderItem).join('');
  }
  track.innerHTML = trackHTML;

  const wrap = track.parentElement;
  const isMobile = window.innerWidth <= 768;
  const visibleCount = isMobile ? 3 : 5;
  const gap = isMobile ? 12 : 24;
  const itemWidth = (wrap.clientWidth - gap * (visibleCount - 1)) / visibleCount;
  track.style.setProperty('--gap', gap + 'px');
  document.querySelectorAll('.brand-item').forEach(el => {
    el.style.width = itemWidth + 'px';
    el.style.minWidth = itemWidth + 'px';
    el.style.maxWidth = itemWidth + 'px';
  });

  window._brandItemWidth = itemWidth + gap;
  window._brandTotal = brandItems.length;
  window._brandRepeat = REPEAT;
  window._brandIndex = brandItems.length * 4; // bắt đầu ở giữa (copy thứ 4/9)
  track.style.transition = 'none';
  track.style.transform = `translateX(-${window._brandIndex * window._brandItemWidth}px)`;
  void track.offsetHeight;
  track.style.transition = 'transform 0.4s ease';
}

function brandNext() {
  const track = document.getElementById('brand-scroll');
  window._brandIndex++;
  track.style.transition = 'transform 0.2s ease';
  track.style.transform = `translateX(-${window._brandIndex * window._brandItemWidth}px)`;

  setTimeout(() => {
    var total  = window._brandTotal;
    var repeat = window._brandRepeat;
    // Nếu vượt quá copy thứ (repeat-2), nhảy lùi lại 3 copy (vẫn cùng vị trí hình ảnh)
    if (window._brandIndex >= total * (repeat - 2)) {
      window._brandIndex -= total * 3;
      track.style.transition = 'none';
      track.style.transform = `translateX(-${window._brandIndex * window._brandItemWidth}px)`;
    }
  }, 420);
}

function brandPrev() {
  const track = document.getElementById('brand-scroll');
  window._brandIndex--;
  track.style.transition = 'transform 0.2s ease';
  track.style.transform = `translateX(-${window._brandIndex * window._brandItemWidth}px)`;

  setTimeout(() => {
    var total  = window._brandTotal;
    // Nếu lùi quá copy thứ 2, nhảy tiến lại 3 copy (vẫn cùng vị trí hình ảnh)
    if (window._brandIndex <= total * 1) {
      window._brandIndex += total * 3;
      track.style.transition = 'none';
      track.style.transform = `translateX(-${window._brandIndex * window._brandItemWidth}px)`;
    }
  }, 420);
}

function goToBrand(hangId) {
  showPage('sanpham', document.getElementById('nav-sp'));
  setTimeout(() => {
    const sel = document.getElementById('filter-hang');
    if (sel) {
      const exists = Array.from(sel.options).some(o => o.value === hangId);
      if (exists) {
        sel.value = hangId;
        filterProducts();
      }
    }
  }, 300);
}

window.addEventListener('resize', function() {
  if (window._brandResizeTimer) clearTimeout(window._brandResizeTimer);
  window._brandResizeTimer = setTimeout(function() {
    if (allProducts.length > 0) renderBrandScroll();
  }, 300);
});
function toggleFloatingChat() {

    toggleBtn.innerHTML = '💬';
    toggleBtn.style.background = 'var(--primary)';
  }
}
